// 1.20.1 + Forge 构建脚本(ForgeGradle 6)。
// 与 1.21.1/NeoForge 线并存: 那条线用 ModDevGradle, 该插件不支持 1.20.1 坐标, 因此本线单列。
plugins {
    id 'eclipse'
    id 'idea'
    id 'java-library'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    // 1.20.1 的目标字节码是 Java 17。ForgeGradle 的 MCP 步骤**强制要求 Java 17 工具链**
    //   (实测报错 DefaultJavaToolchainService.launcherFor), 因此本线必须使用 JDK 17;
    //   本机 JDK 17 的路径通过 gradle.properties 的 installations.paths 告知 Gradle。
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'info'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'info'
            mods { "${mod_id}" { source sourceSets.main } }
        }
    }
}

repositories {
    maven { url = 'https://maven.createmod.net/' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Create 1.20.1: 用 **all** 分类器(内嵌 Ponder/catnip/Flywheel/Registrate)。
    //   实测: create 的 maven 上 1.20.1 线只有 all / slim / sources / javadoc, 且 ponder-forge 等
    //   独立坐标只有 1.21.1 及以后 —— 与调研"前置模组已被 Create 内嵌"一致, 因此 slim 会缺类。
    compileOnly fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:all")

    // 开发期(仅 runClient / runServer)需要 Create 真的在场上, 且必须是 remap 到开发映射的产物 ——
    // 直接把平台版 jar 丢进 mods 目录会因为 mixin 里是 SRG 名而报 InvalidAccessorException。
    // 发布产物仍然只声明 compileOnly(用户自己装 Create)。
    runtimeOnly fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:all")

    // Ponder / Flywheel / Registrate 在 1.20.1 上随 Create 以 jar-in-jar 形式打包, 公开 maven 上
    // 没有 1.20.1 的独立坐标(实测: ponder-forge 等只有 1.21.1 及以后)。因此从 Create 的 all 产物中
    // 解出这些嵌套 jar(tools/lib, 由 tools 下的脚本生成), 以文件依赖接入编译期。
    // 运行期由 Forge 的 jar-in-jar 机制提供同一批库, 版本一致。
    // 嵌套库改为在构建期从 Create 的 all 产物里解出(见下方 extractCreateNestedLibs 任务),
    // 使仓库自包含: CI 与任何新克隆都不需要预先准备本地文件。
    compileOnly files(tasks.named('extractCreateNestedLibs'))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : 'nonono',
            'Specification-Version'   : '1',
            'Implementation-Title'    : mod_id,
            'Implementation-Version'  : version,
            'Implementation-Vendor'   : 'nonono'
        ])
    }
}

// ForgeGradle 不会自动替换 mods.toml 里的占位符(那是 NeoForge 的 ModDevGradle 行为),
// 因此显式做一次 processResources 展开; 占位符来源与 gradle.properties 同源。
tasks.named('processResources', ProcessResources).configure {
    // 关键: Gradle 默认用平台编码回写文件, 在中文 Windows 上会把 UTF-8 的模板写成 GBK,
    // 导致 jar 里的 mods.toml 不是合法 UTF-8(Forge 读取会失败)。
    filteringCharset = 'UTF-8'
    var replaceProperties = [
        mod_id                : mod_id,
        mod_name              : mod_name,
        mod_license           : 'MIT',
        mod_version           : mod_version,
        loader_version_range  : loader_version_range,
        minecraft_version_range: minecraft_version_range,
        create_version_range  : create_version_range,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

// Create 的 all 产物内嵌 Ponder / Flywheel / Registrate(公开 maven 上没有 1.20.1 的独立坐标),
// 编译期需要这些类, 因此把它们从产物里解到 build/ 下再作为文件依赖使用。
configurations {
    createAll
}

dependencies {
    createAll "com.simibubi.create:create-${minecraft_version}:${create_version}:all"
}

tasks.register('extractCreateNestedLibs', Copy) {
    from({ zipTree(configurations.createAll.singleFile) }) {
        include 'META-INF/jars/*.jar'
        eachFile { it.relativePath = new org.gradle.api.file.RelativePath(true, it.name) }
    }
    into layout.buildDirectory.dir('create-nested-libs')
    includeEmptyDirs = false
}
