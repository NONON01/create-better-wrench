// 1.20.1 + Forge 构建脚本(ForgeGradle 6)。
// 与 1.21.1/NeoForge 线并存: 那条线用 ModDevGradle, 该插件不支持 1.20.1 坐标, 因此本线单列。
plugins {
    id 'eclipse'
    id 'idea'
    id 'java-library'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    // 1.20.1 的目标字节码是 Java 17。ForgeGradle 的 MCP 步骤**强制要求 Java 17 工具链**
    //   (实测报错 DefaultJavaToolchainService.launcherFor), 因此本线必须使用 JDK 17;
    //   本机 JDK 17 的路径通过 gradle.properties 的 installations.paths 告知 Gradle。
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'info'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'info'
            mods { "${mod_id}" { source sourceSets.main } }
        }
    }
}

repositories {
    maven { url = 'https://maven.createmod.net/' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Create 1.20.1: 用 **all** 分类器(内嵌 Ponder/catnip/Flywheel/Registrate)。
    //   实测: create 的 maven 上 1.20.1 线只有 all / slim / sources / javadoc, 且 ponder-forge 等
    //   独立坐标只有 1.21.1 及以后 —— 与调研"前置模组已被 Create 内嵌"一致, 因此 slim 会缺类。
    compileOnly fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:all")

    // 开发期(仅 runClient / runServer)需要 Create 真的在场上, 且必须是 remap 到开发映射的产物 ——
    // 直接把平台版 jar 丢进 mods 目录会因为 mixin 里是 SRG 名而报 InvalidAccessorException。
    // 发布产物仍然只声明 compileOnly(用户自己装 Create)。
    runtimeOnly fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:all")

    // Ponder / Flywheel / Registrate: 1.20.1 的 Create 以 jar-in-jar 打包它们, 公开 maven 上没有
    // 独立坐标(实测 ponder-forge 等只有 1.21.1 及以后), 因此把这三个 jar 放在仓库的 libs/ 下作为
    // 编译期依赖。仅编译用, 不随产物分发; 运行期由 Create 的 jar-in-jar 提供同一批库。
    // 三者均为 MIT 系许可, 来源与许可说明见 libs/README.md。
    compileOnly fileTree('libs') { include '*.jar' }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : 'nonono',
            'Specification-Version'   : '1',
            'Implementation-Title'    : mod_id,
            'Implementation-Version'  : version,
            'Implementation-Vendor'   : 'nonono'
        ])
    }
}

// ForgeGradle 不会自动替换 mods.toml 里的占位符(那是 NeoForge 的 ModDevGradle 行为),
// 因此显式做一次 processResources 展开; 占位符来源与 gradle.properties 同源。
tasks.named('processResources', ProcessResources).configure {
    // 关键: Gradle 默认用平台编码回写文件, 在中文 Windows 上会把 UTF-8 的模板写成 GBK,
    // 导致 jar 里的 mods.toml 不是合法 UTF-8(Forge 读取会失败)。
    filteringCharset = 'UTF-8'
    var replaceProperties = [
        mod_id                : mod_id,
        mod_name              : mod_name,
        mod_license           : 'MIT',
        mod_version           : mod_version,
        loader_version_range  : loader_version_range,
        minecraft_version_range: minecraft_version_range,
        create_version_range  : create_version_range,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}
