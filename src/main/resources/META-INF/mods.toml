modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="nonono"
logoFile="icon.png"
displayURL="https://modrinth.com/mod/create-better-wrench"
description="A Better Wrench For Create."

# 1.20.1 line depends on Forge (not NeoForge).
# 1.20.1 的依赖块用 mandatory 字段(NeoForge 才用 type="required"; Forge 47 解析不到 mandatory 会直接报错)。
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${loader_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    mandatory=true
    versionRange="${create_version_range}"
    ordering="AFTER"
    side="BOTH"
