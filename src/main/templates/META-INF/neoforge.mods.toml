modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

# 本模板由 Groovy expand 处理: 注释与字段值中不得出现反斜杠(会被当作转义符导致构建失败), 路径使用正斜杠。
#
# 可选字段的取舍:
#   * issueTrackerURL 不填写 —— 该字段可选, 且反馈入口由仓库 Issues 页与平台页面承担;
#   * displayURL 指向 Modrinth 项目页, 与平台侧的 Source / Issues 字段保持一致。

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="nonono"
# 图标位于 jar 根, 源文件为 src/main/resources/icon.png。
# logoBlur=false 对应 GL_NEAREST: 图标为像素风硬边, 线性过滤会使其模糊(官方默认值为 true)。
logoFile="icon.png"
logoBlur=false
# credits 字段不填写: 署名与许可集中承载, 不在此处重复。
# 全部许可与第三方声明(含 Create 的 MIT 全文, 逐字收录)集中在 jar 内的单个 LICENSE.md;
# 游戏内模组列表的"许可证"字段即指向该文件; 另有 client/WrenchToolSelection.java 的类注释保留版权行。
displayURL="https://modrinth.com/mod/create-better-wrench"
description='''
A Better Wrench For Create.
'''

# 依赖 NeoForge 与 Minecraft
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# 依赖机械动力 Create(本 mod 是纯 Create addon, 必装)
# ordering 使用 NONE(而非 AFTER): 本模组只在运行时调用 Create 的公开 API, 不要求强制加载顺序;
# 使用 AFTER 会让 NeoForge 强制将 Create 排在前方, 属不必要的强约束(依据见 docs/operations/publishing.md §5.1)。
[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="[6.0.10,6.1.0)"
    ordering="NONE"
    side="BOTH"
