modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

# ⚠️ 发布前必须替换: 下面 2 个 REPLACE_ME 需要真实的仓库 / 项目页地址(见 docs/10 §5.1)。
#    ⚠️ 本模板由 Groovy expand 处理, **正文里不要出现反斜杠**(会被当转义符导致构建失败), 路径一律用正斜杠。
#    自检: 搜本文件里的 REPLACE_ME
issueTrackerURL="https://github.com/REPLACE_ME/create-better-wrench/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="nonono"
# 图标(在 jar 根; 源文件 src/main/resources/icon.png)。
# logoBlur=false -> GL_NEAREST: 我们的图标是像素风/硬边, 用线性过滤会糊(官方默认是 true)。
logoFile="icon.png"
logoBlur=false
# 2026-09-18: 按用户要求移除游戏内"鸣谢"(credits)字段。
# ⚠️ 不是省掉署名 —— Create 的 MIT 署名义务仍由 jar 内的
#    licenses/Create-MIT.txt(全文)、THIRD_PARTY_NOTICES.md, 以及
#    client/WrenchToolSelection.java 的类注释共同承担。
displayURL="https://modrinth.com/mod/REPLACE_ME"
description='''
A Better Wrench For Create.
'''

# 依赖 NeoForge 与 Minecraft
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# 依赖机械动力 Create(本 mod 是纯 Create addon, 必装)
# ⚠️ ordering 用 NONE(不是 AFTER): 我们只在运行时调用 Create 的公开 API, 不需要强制加载顺序;
#    用 AFTER 会让 NeoForge 强制把 Create 排在我们前面, 属于不必要的强约束(docs/10 §5.1)。
[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="[6.0.10,6.1.0)"
    ordering="NONE"
    side="BOTH"
