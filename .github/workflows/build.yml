name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 说明: 此处不使用 gradle/actions/setup-gradle —— 它注入的 init 脚本需要高于 JDK 17 的字节码,
      # 与本线(JDK 17 + Gradle 8.1.1)冲突。构建直接用仓库内的 wrapper。

      - name: Build with Gradle
        run: ./gradlew build