name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # 1.20.1 线必须使用 JDK 17: Gradle 8.1.1 与 ForgeGradle 6 的要求(Gradle 8.1.1 不支持 JDK 21)。
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 不使用 gradle/actions/setup-gradle: 其注入的 init 脚本为 Java 21 字节码, 与本线不兼容。

      - name: Build with Gradle
        run: ./gradlew build
