# 发布到 Modrinth 与 CurseForge(1.21.1 与 1.20.1 两条线): 由 GitHub Release 触发, 使用 Kira-NT/mc-publish。
# 加载器、游戏版本、Java 与 Create 依赖由标签里的 Minecraft 版本自动判定。
#
# 触发方式:
#   * 在 GitHub 上创建/发布 Release(包括预发布)时自动运行 —— 本项目的 Release 由
#     scripts/publish-<版本>.ps1 经 API 创建, 创建完成即触发本工作流;
#   * 也可在仓库的 Actions 页面手动运行(workflow_dispatch)并填入标签, 用于补发已存在的 Release。
#
# 前置条件:
#   * 仓库 Secret 名为 MODRINTH_TOKEN, 值为 Modrinth 个人访问令牌(账户设置 -> PAT, 至少勾选
#     "Create versions"); 令牌只存在于 GitHub 侧, 不进入仓库;
#   * 仓库 Secret 名为 CURSEFORGE_TOKEN, 值为 CurseForge 作者后台的 API 令牌;
#   * 版本号由标签去掉前缀 v 得到(v1.0.5-beta+mc1.21.1 到 1.0.5-beta+mc1.21.1);
#   * 依赖在创建版本时一并提交: Modrinth 的 API 不支持事后修改版本的依赖。
#
# 变更日志口径:
#   * Modrinth 不提交版本 changelog(下方 changelog 为空字符串);
#   * CurseForge 每次上传都必须有变更日志, 缺失会被退回。默认写一句「修复了一些已知问题」;
#     遇到大版本(例如 1.1.0)时, 在创建 Release 时填写正文, 本工作流会自动改用正文作为
#     CurseForge 的正式变更日志 —— 两个平台互不影响。
#
# 说明: 本工作流只发布到 Modrinth 与 CurseForge, 不创建也不修改 GitHub Release(未提供 github-token)。

name: Publish to Modrinth and CurseForge

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example v1.0.5-beta+mc1.21.1)"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag and version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="$RELEASE_TAG"
          if [ -z "$TAG" ]; then TAG="$INPUT_TAG"; fi
          if [ -z "$TAG" ]; then echo "No tag provided" >&2; exit 1; fi
          VERSION="${TAG#v}"

          # 两条线共用本工作流: 由标签里的 Minecraft 版本决定加载器、游戏版本、Java 与 Create 依赖。
          # 1.21.1 线沿用原取值, 行为不变; 1.20.1 线使用 Forge 与 Java 17。
          if [[ "$VERSION" == *"mc1.20.1"* ]]; then
            echo "loaders=forge"                >> "$GITHUB_OUTPUT"
            echo "game_versions=1.20.1"         >> "$GITHUB_OUTPUT"
            echo "java=Java 17"                 >> "$GITHUB_OUTPUT"
            echo "create_dep=LNytGWDc@mc1.20.1-6.0.8(required)" >> "$GITHUB_OUTPUT"
          else
            echo "loaders=neoforge"             >> "$GITHUB_OUTPUT"
            echo "game_versions=1.21.1"         >> "$GITHUB_OUTPUT"
            echo "java=Java 21"                 >> "$GITHUB_OUTPUT"
            echo "create_dep=LNytGWDc@6.0.10+mc1.21.1(required)" >> "$GITHUB_OUTPUT"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG version=$VERSION"

      - name: Download the jar attached to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p artifacts
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern '*.jar' --dir artifacts
          ls -l artifacts

      - name: Publish to Modrinth and CurseForge
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: gm5PPeYh
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          files: artifacts/*.jar
          name: Create Better Wrench ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          version-type: beta
          loaders: ${{ steps.version.outputs.loaders }}
          game-versions: ${{ steps.version.outputs.game_versions }}
          environment: client | server

          # 本项目既定口径: Modrinth 不填版本 changelog(空字符串即不提交)
          changelog: ""

          # Create 为必装前置; 与手动上传时选择的依赖保持一致
          modrinth-dependencies: |
            ${{ steps.version.outputs.create_dep }}

          # CurseForge: 项目 id 为作者后台项目页的编号, 首个文件已按手动上传的口径核对
          curseforge-id: 1722342
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          # CurseForge 强制要求变更日志: 默认一句简报;
          # Release 正文非空时(大版本才写)自动改用正文作为正式变更日志
          curseforge-changelog: ${{ github.event.release.body != '' && github.event.release.body || '修复了一些已知问题' }}
          curseforge-dependencies: |
            328085(required)

          # CurseForge 的 Java 字段, 与手动上传首个文件时选择的取值一致
          java: ${{ steps.version.outputs.java }}

          # 发布失败不静默: 运行记录直接变红, 便于人工用 workflow_dispatch 补发
          fail-mode: fail
          retry-attempts: 3
          retry-delay: 10000
