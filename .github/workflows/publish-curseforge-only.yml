name: Publish to CurseForge only

# 一次性用途: 只把某个已存在的 Release 的 jar 发到 CurseForge(不动 Modrinth, 避免重复版本)。
# 加载器/游戏版本/Java/Create 依赖由标签里的 Minecraft 版本判定。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example v1.1.1-beta+mc1.21.1)"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag and target values
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          VERSION="${TAG#v}"
          if [[ "$VERSION" == *"mc1.20.1"* ]]; then
            echo "java=Java 17" >> "$GITHUB_OUTPUT"
            echo "loader=forge" >> "$GITHUB_OUTPUT"
            echo "create_dep=328085@mc1.20.1-6.0.8(required)" >> "$GITHUB_OUTPUT"
            echo "game=1.20.1" >> "$GITHUB_OUTPUT"
          else
            echo "java=Java 21" >> "$GITHUB_OUTPUT"
            echo "loader=neoforge" >> "$GITHUB_OUTPUT"
            echo "create_dep=328085(required)" >> "$GITHUB_OUTPUT"
            echo "game=1.21.1" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download the jar attached to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p artifacts
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern '*.jar' --dir artifacts
          ls -l artifacts
          gh release view "$TAG" --repo "${{ github.repository }}" --json body --jq .body > changelog.md
          wc -c changelog.md

      - name: Publish to CurseForge
        id: publish
        uses: Kira-NT/mc-publish@v3
        with:
          files: artifacts/*.jar
          name: Create Better Wrench ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          version-type: beta
          loaders: ${{ steps.version.outputs.loader }}
          game-versions: ${{ steps.version.outputs.game }}
          environment: client | server
          changelog-file: changelog.md

          curseforge-id: 1722342
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-changelog-file: changelog.md
          curseforge-dependencies: |
            ${{ steps.version.outputs.create_dep }}
          java: ${{ steps.version.outputs.java }}

          fail-mode: fail
          retry-attempts: 3
          retry-delay: 10000

      - name: Print publish outputs
        if: always()
        run: |
          echo "curseforge-id      : ${{ steps.publish.outputs.curseforge-id }}"
          echo "curseforge-version : ${{ steps.publish.outputs.curseforge-version }}"
          echo "curseforge-url     : ${{ steps.publish.outputs.curseforge-url }}"
          echo "curseforge-files   : ${{ steps.publish.outputs.curseforge-files }}"
