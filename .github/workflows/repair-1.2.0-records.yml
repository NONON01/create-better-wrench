name: Repair 1.2.0 platform records (temporary)

# 临时运维工作流: 只用于修正 1.2.0 在两个平台上的记录
#   * Modrinth 1.20.1 版本的 loader/游戏版本(被 publish.yml 的固定值写成了 neoforge/1.21.1);
#   * 两个平台的 changelog(取双语、英文在前的正文)。
# 密钥只从仓库 Secret 读取, 绝不打印; 查完即可删除本文件。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect | fix-modrinth | delete-cf-1.2.0"
        required: true
        default: inspect

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Modrinth inspect / repair
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_ID: gm5PPeYh
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          TOKEN = os.environ['MODRINTH_TOKEN']
          PID = os.environ['MODRINTH_ID']
          MODE = os.environ['MODE']
          BASE = 'https://api.modrinth.com/v2'
          CHANGELOG = (
              "Added feature [Chain Conveyor] / 增添功能[锁链传动]\n"
              "Build your logistics network quickly / 快速搭建你的物流网络\n\n"
              "Right-click to pick a start and an end conveyor: the wrench plans the path, places the missing chain conveyors and links them with chains. Three layouts: Standard / Straight / Semi-auto; every switch and limit lives in `/cbw config`, including the total chain-length cap that keeps one layout from spanning too far.\n"
              "一次右键即可选定起点与终点：扳手自动规划路径、补齐沿途的链式传动轮并建立连接；支持 标准 / 直线 / 半自动 三种铺设方式，全部开关与上限可在 `/cbw config` 里调整（含链条总长上限，防止一次连接过远）。\n\n"
          )

          def call(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(BASE + path, data=data, method=method)
              req.add_header('Authorization', 'Bearer ' + TOKEN)
              req.add_header('User-Agent', 'cbw-repair/1.0 (github.com/NONON01/create-better-wrench)')
              if data is not None:
                  req.add_header('Content-Type', 'application/json')
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      body = r.read().decode()
                      return r.status, body
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()

          st, body = call('GET', '/project/' + PID)
          print('project http=%s' % st)
          if st == 200:
              p = json.loads(body)
              print('  slug=%s status=%s id=%s' % (p.get('slug'), p.get('status'), p.get('id')))
          else:
              print('  body=%s' % body[:200])

          st, body = call('GET', '/project/%s/version' % PID)
          print('versions http=%s' % st)
          if st != 200:
              print('  body=%s' % body[:300])
              raise SystemExit(0)
          versions = json.loads(body)
          for v in versions:
              cl = v.get('changelog') or ''
              print('  ver=%-22s id=%-10s loaders=%-12s games=%-14s clen=%-4d first=%s' % (
                  v.get('version_number'), v.get('id'), ','.join(v.get('loaders') or []),
                  ','.join(v.get('game_versions') or []), len(cl),
                  (cl.strip().splitlines()[0][:70] if cl.strip() else '(empty)')))

          if MODE != 'fix-modrinth':
              raise SystemExit(0)

          for v in versions:
              ver = v.get('version_number') or ''
              if '1.2.0' not in ver:
                  continue
              cl = v.get('changelog') or ''
              if 'mc1.20.1' in ver:
                  want = {'loaders': ['forge'], 'game_versions': ['1.20.1'], 'changelog': CHANGELOG}
              else:
                  want = {'changelog': CHANGELOG}
              if 'mc1.20.1' in ver and (v.get('loaders') == ['forge'] and v.get('game_versions') == ['1.20.1'] and cl.strip()):
                  print('  %s already correct; skipping' % ver)
                  continue
              if 'mc1.20.1' not in ver and cl.strip() and 'Chain Conveyor' in cl:
                  print('  %s changelog already bilingual; skipping' % ver)
                  continue
              st, body = call('PATCH', '/version/' + v['id'], want)
              print('  PATCH %s -> http=%s' % (ver, st))
              if st >= 300:
                  print('    patch failed: %s' % body[:200])
                  if 'mc1.20.1' in ver:
                      st2, body2 = call('DELETE', '/version/' + v['id'])
                      print('    DELETE %s -> http=%s body=%s' % (v['id'], st2, body2[:120]))

          st, body = call('GET', '/project/%s/version' % PID)
          print('--- after ---')
          if st == 200:
              for v in json.loads(body):
                  cl = v.get('changelog') or ''
                  print('  ver=%-22s loaders=%-12s games=%-14s clen=%-4d first=%s' % (
                      v.get('version_number'), ','.join(v.get('loaders') or []),
                      ','.join(v.get('game_versions') or []), len(cl),
                      (cl.strip().splitlines()[0][:70] if cl.strip() else '(empty)')))
          PY

      - name: CurseForge inspect (and optional delete of 1.2.0 files)
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODE: ${{ inputs.mode }}
          CF_MOD: "1722342"
        run: |
          set -euo pipefail
          curl -sS -H "x-api-key: $CURSEFORGE_TOKEN" -H "Accept: application/json" \
            "https://api.curseforge.com/v1/mods/$CF_MOD/files?pageSize=50" -o cf.json -w "http=%{http_code}\n"
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          TOKEN = os.environ['CURSEFORGE_TOKEN']
          MOD = os.environ['CF_MOD']
          MODE = os.environ['MODE']
          data = json.load(open('cf.json')).get('data')
          if not isinstance(data, list):
              print('curseforge response: %s' % str(data)[:300])
              raise SystemExit(0)
          for f in data:
              cl = f.get('changelog') or ''
              print('  id=%-9s name=%-46s games=%-26s clen=%-4d first=%s' % (
                  f.get('id'), f.get('fileName'), ','.join(f.get('gameVersions') or []), len(cl),
                  (cl.strip().splitlines()[0][:60] if cl.strip() else '(empty)')))

          if MODE == 'delete-cf-1.2.0':
              for f in data:
                  if '1.2.0' not in (f.get('fileName') or ''):
                      continue
                  req = urllib.request.Request(
                      'https://api.curseforge.com/v1/mods/%s/files/%s' % (MOD, f['id']), method='DELETE')
                  req.add_header('x-api-key', TOKEN)
                  req.add_header('Accept', 'application/json')
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          print('  DELETE %s -> http=%s' % (f['id'], r.status))
                  except urllib.error.HTTPError as e:
                      print('  DELETE %s -> http=%s body=%s' % (f['id'], e.code, e.read().decode()[:160]))
          PY
