name: Repair 1.2.0 platform records (temporary)

# 临时运维工作流: 只用于修正 1.2.0 在两个平台上的记录
#   * Modrinth 1.20.1 版本的 loader/游戏版本(被 publish.yml 的固定值写成了 neoforge/1.21.1);
#   * 两个平台的 changelog(双语、英文在前)。
# 密钥只从仓库 Secret 读取, 绝不打印; 完成后可删除本文件。
#   MODRINTH_TOKEN      读/改 Modrinth 版本
#   CURSEFORGE_API_KEY  CurseForge Core API 读(与上传用的 CURSEFORGE_TOKEN 是两把不同的凭据)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect | fix | delete-cf-1.2.0"
        required: true
        default: inspect

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Modrinth inspect / repair
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_ID: gm5PPeYh
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          TOKEN = os.environ['MODRINTH_TOKEN']
          PID = os.environ['MODRINTH_ID']
          MODE = os.environ['MODE']
          BASE = 'https://api.modrinth.com/v2'
          CHANGELOG = (
              "Added feature [Chain Conveyor] / 增添功能[锁链传动]\n"
              "Build your logistics network quickly / 快速搭建你的物流网络\n\n"
              "Right-click to pick a start and an end conveyor: the wrench plans the path, places the missing chain conveyors and links them with chains. Three layouts: Standard / Straight / Semi-auto; every switch and limit lives in `/cbw config`, including the total chain-length cap that keeps one layout from spanning too far.\n"
              "一次右键即可选定起点与终点：扳手自动规划路径、补齐沿途的锁链传动轮并建立连接；支持 标准 / 直线 / 半自动 三种铺设方式，全部开关与上限可在 `/cbw config` 里调整（含链条总长上限，防止一次连接过远）。"
          )

          def call(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(BASE + path, data=data, method=method)
              req.add_header('Authorization', 'Bearer ' + TOKEN)
              req.add_header('User-Agent', 'cbw-repair/1.0 (github.com/NONON01/create-better-wrench)')
              if data is not None:
                  req.add_header('Content-Type', 'application/json')
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()

          def dump(tag):
              st, body = call('GET', '/project/%s/version' % PID)
              print('%s versions http=%s' % (tag, st))
              if st != 200:
                  print('  body=%s' % body[:300])
                  return
              for v in json.loads(body):
                  cl = v.get('changelog') or ''
                  print('  ver=%-22s id=%-10s loaders=%-9s games=%-8s clen=%-4d first=%s' % (
                      v.get('version_number'), v.get('id'), ','.join(v.get('loaders') or []),
                      ','.join(v.get('game_versions') or []), len(cl),
                      (cl.strip().splitlines()[0][:64] if cl.strip() else '(empty)')))

          st, body = call('GET', '/project/' + PID)
          print('project http=%s' % st)
          if st == 200:
              p = json.loads(body)
              print('  slug=%s status=%s id=%s' % (p.get('slug'), p.get('status'), p.get('id')))

          dump('before')
          if MODE != 'fix':
              raise SystemExit(0)

          st, body = call('GET', '/project/%s/version' % PID)
          for v in json.loads(body):
              ver = v.get('version_number') or ''
              if '1.2.0' not in ver:
                  continue
              cl = v.get('changelog') or ''
              needs_loader = 'mc1.20.1' in ver and (
                  v.get('loaders') != ['forge'] or v.get('game_versions') != ['1.20.1'])
              needs_changelog = not cl.strip()
              if not needs_loader and not needs_changelog:
                  print('  %s already correct; skipping' % ver)
                  continue
              want = {}
              if needs_loader:
                  want['loaders'] = ['forge']
                  want['game_versions'] = ['1.20.1']
              if needs_changelog:
                  want['changelog'] = CHANGELOG
              st2, body2 = call('PATCH', '/version/' + v['id'], want)
              print('  PATCH %s (%s) -> http=%s' % (ver, ','.join(sorted(want)), st2))
              if st2 >= 300:
                  print('    patch body: %s' % body2[:200])
                  if 'mc1.20.1' in ver and needs_loader:
                      st3, body3 = call('DELETE', '/version/' + v['id'])
                      print('    DELETE %s -> http=%s body=%s' % (v['id'], st3, body3[:120]))
          dump('after')
          PY

      - name: CurseForge inspect / repair / delete
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODE: ${{ inputs.mode }}
          CF_MOD: "1722342"
        run: |
          set -euo pipefail
          code=$(curl -sS -o cf.json -w "%{http_code}" -H "x-api-key: $CURSEFORGE_API_KEY" -H "Accept: application/json" \
            "https://api.curseforge.com/v1/mods/$CF_MOD/files?pageSize=50")
          echo "curseforge files http=$code"
          if [ "$code" != "200" ]; then
            echo "body: $(head -c 300 cf.json)"
            exit 0
          fi
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          KEY = os.environ['CURSEFORGE_API_KEY']
          MOD = os.environ['CF_MOD']
          MODE = os.environ['MODE']
          CHANGELOG = (
              "Added feature [Chain Conveyor] / 增添功能[链传动]\n"
              "Build your logistics network quickly / 快速搭建你的物流网络\n\n"
              "Right-click to pick a start and an end conveyor: the wrench plans the path, places the missing chain conveyors and links them with chains. Three layouts: Standard / Straight / Semi-auto; every switch and limit lives in `/cbw config`.\n"
              "一次右键即可选定起点与终点：扳手自动规划路径、补齐沿途的锁链传动轮并建立连接；支持 标准 / 直线 / 半自动 三种铺设方式，全部开关与上限可在 `/cbw config` 里调整。"
          )

          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request('https://api.curseforge.com/v1' + path, data=data, method=method)
              req.add_header('x-api-key', KEY)
              req.add_header('Accept', 'application/json')
              if data is not None:
                  req.add_header('Content-Type', 'application/json')
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()

          def dump(tag):
              st, body = api('GET', '/mods/%s/files?pageSize=50' % MOD)
              print('%s files http=%s' % (tag, st))
              if st != 200:
                  print('  body=%s' % body[:300])
                  return
              for f in json.loads(body).get('data', []):
                  cl = f.get('changelog') or ''
                  print('  id=%-9s name=%-46s games=%-26s clen=%-4d first=%s' % (
                      f.get('id'), f.get('fileName'), ','.join(f.get('gameVersions') or []), len(cl),
                      (cl.strip().splitlines()[0][:56] if cl.strip() else '(empty)')))

          dump('before')
          if MODE == 'fix':
              st, body = api('GET', '/mods/%s/files?pageSize=50' % MOD)
              for f in json.loads(body).get('data', []):
                  if '1.2.0' not in (f.get('fileName') or ''):
                      continue
                  cl = f.get('changelog') or ''
                  if cl.strip():
                      print('  file %s already has a changelog; skipping' % f.get('id'))
                      continue
                  st2, body2 = api('PATCH', '/mods/%s/files/%s' % (MOD, f.get('id')), {'changelog': CHANGELOG})
                  print('  PATCH file %s -> http=%s body=%s' % (f.get('id'), st2, body2[:160]))
              dump('after')
          elif MODE == 'delete-cf-1.2.0':
              st, body = api('GET', '/mods/%s/files?pageSize=50' % MOD)
              for f in json.loads(body).get('data', []):
                  if '1.2.0' not in (f.get('fileName') or ''):
                      continue
                  st2, body2 = api('DELETE', '/mods/%s/files/%s' % (MOD, f.get('id')))
                  print('  DELETE file %s (%s) -> http=%s body=%s' % (f.get('id'), f.get('fileName'), st2, body2[:120]))
          PY
