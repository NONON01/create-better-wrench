# ---- 工程标识 ----
mod_id=create_better_wrench
mod_group_id=com.nonono.createbetterwrench
mod_version=1.2.0+mc1.20.1
mod_name=Create Better Wrench

# ---- 目标平台(1.20.1 + Forge, 见 docs/design/port-research-1.20.1.md 第 4 节) ----
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]
forge_version=47.1.3
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

# ---- 前置模组(1.20.1 的 Create 与 Ponder 均随 Create 内嵌, 只作编译期依赖) ----
create_version=6.0.8-291
create_version_range=[6.0.8,6.1.0)
ponder_version=1.0.82
flywheel_version=1.0.6
registrate_version=MC1.20-1.3.3

# ---- 工具链(1.20.1 为 Java 17) ----
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# ---- 本机 JDK 位置(1.20.1 线需要 JDK 17; 21 线保留, 便于同机切换) ----
org.gradle.java.installations.auto-download=false

# 说明: 构建需要 JDK 17(Gradle 8.1.1 与 ForgeGradle 6 的要求)。
# 本文件不写死 JDK 路径 —— 本地用 JAVA_HOME 指向 JDK 17, CI 由 setup-java 提供 JDK 17。
