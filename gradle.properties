# JVM/Gradle 参数
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment 映射(1.21.1 的官方推荐)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# NeoForge 版本见 https://projects.neoforged.net/neoforged/neoforge
neo_version=21.1.249
loader_version_range=[1,)

# 本 Mod 属性
mod_id=create_better_wrench
mod_name=Universal Wrench
# 许可证字段做成了"指针式"(和 Create 的做法一致: 它写的是 "Read attached LICENSE.md")。
# 指向 jar 内的 LICENSE.md —— 那**一个**文件里同时包含:本模组条款、全部第三方声明、
# 以及 Create 的 MIT 许可全文(逐字收录, 满足 MIT 的硬性要求)。
mod_license=Read attached LICENSE.md
mod_version=0.4.0+create6.0.10
mod_group_id=com.nonono.createbetterwrench

# ---- 机械动力 Create 集成 ----
# 本 mod 是纯 Create addon(核心 = 更好用的 Create 扳手), 故默认 enableCreate=true
enableCreate=true
# Create 6.x (NeoForge 1.21.1)，取自 https://wiki.createmod.net/developers/depend-on-create
# 6.0.10-280 = 已发布版 6.0.10 在 maven 上对应的 dev/CI 构建号
create_version=6.0.10-280
ponder_version=1.0.82
flywheel_version=1.0.6
registrate_version=MC1.21-1.3.0+67
